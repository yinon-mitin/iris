services:
  ytdl:
    build: .
    image: ytdlbot:private
    env_file:
      - .env
    # tini as PID 1: forwards the restart signal from docker-entrypoint.sh to the bot
    init: true
    # only for the entrypoint firewall (blocks the home network); the bot itself runs without it
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./youtube-cookies.txt:/app/youtube-cookies.txt
    logging:
      options:
        max-size: "10m"
        max-file: "3"
